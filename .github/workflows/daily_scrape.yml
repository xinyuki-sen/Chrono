name: Chrono Legacy v1 Scrape & Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r legacy_v1/requirements.txt

      - name: Run AI News Bot
        working-directory: ./legacy_v1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ai_news_bot.py

      - name: Prepare output folder
        run: |
          mkdir -p site
          cp -r assets site/ || true
          cp legacy_v1/*.html site/ || true
          cp legacy_v1/*.json site/ || true
          cp legacy_v1/seen_posts.db site/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
